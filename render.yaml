services:
  - type: web
    name: chengwei-memory-puzzle
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chengwei-memory-puzzle-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: chengwei-memory-puzzle-db
    databaseName: chengwei_memory_puzzle
    user: chengwei_user
    plan: free
